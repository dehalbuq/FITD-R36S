name: FITD R36S ARM64 (yaz0r experimental)

on:
  push:
    branches: [main, "port/fitd-yaz0r-aarch64", "debug/audio-door-room-crash-20261027", "debug/library-room-crash-20261028", "debug/throw-null-body-20261028", "debug/ball-enemies-hit-shake-20261028", "debug/worm-camera-orb-audio-20261028", "fix/orb-hit-object-rehaunted-20261028", "fix/cellar-revolver-inventory-spawn-20261029", "fix/rehaunted-mask-reptile-diagnostic-20261030", "debug/cellar-barrels-stuck-20261030", "fix/cellar-wall-readable-font-20261030", "fix/female-graphics-mask-isolation-20261031", "feat/startup-credits-legal-splash-20261031", "release/r36s-aarch64-safe-20261101"]
    paths:
      - "v2/build_arm64.sh"
      - "v2/patch_*.py"
      - "v2/gen_readable_font.py"
      - "v2/generate_startup_splash.py"
      - "v2/prepare_release_arm64.py"
      - "v2/port/**"
      - "v2/package_portmaster_release.py"
      - "v2/test_*.sh"
      - "v2/test_*.py"
      - ".github/workflows/fitd-r36s-arm64.yml"
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout port scripts
        uses: actions/checkout@v4
      - name: Static PortMaster submission preflight
        run: |
          bash -n v2/port/FITD-R36S-ARM64-RELEASE.sh
          sh -n v2/port/check_compatibility.sh
          bash -n v2/build_arm64.sh
          python3 -m py_compile v2/package_portmaster_release.py v2/prepare_release_arm64.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('v2/port/port-release.json').read_text())
          assert m['version'] == 4
          assert m['attr']['arch'] == ['aarch64']
          assert Path('v2/PORTMASTER_SUBMISSION.md').is_file()
          print('PortMaster static submission preflight passed')
          PY
      - name: Test ArkOS4Clone and dArkOSRE launcher routing
        run: bash v2/test_arm64_launcher_selection.sh
      - name: Install native AArch64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git python3 python3-pil fonts-dejavu-core cmake ninja-build build-essential pkg-config zip \
            libasound2-dev libpulse-dev libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libopengl-dev libdbus-1-dev libudev-dev libwayland-dev
      - name: Patch and build FITD for R36S (release without debug)
        if: github.ref_name == 'release/r36s-aarch64-safe-20261101'
        env:
          FITD_RELEASE: "1"
        run: bash v2/build_arm64.sh
      - name: Patch and build FITD for R36S (diagnostics)
        if: github.ref_name != 'release/r36s-aarch64-safe-20261101'
        env:
          FITD_RELEASE: "0"
        run: bash v2/build_arm64.sh
      - name: Validate release ZIP and calculate SHA256
        if: github.ref_name == 'release/r36s-aarch64-safe-20261101'
        run: |
          unzip -t work/fitdr36s.zip | tail -n 2
          unzip -Z1 work/fitdr36s.zip | grep -Fx 'fitdr36s/fitd.aarch64'
          unzip -Z1 work/fitdr36s.zip | grep -Fx 'port.json'
          unzip -Z1 work/fitdr36s.zip | grep -Fx 'gameinfo.xml'
          unzip -Z1 work/fitdr36s.zip | grep -Fx 'FITD-R36S-ARM64.sh'
          ( cd work && sha256sum fitdr36s.zip > SHA256SUMS.txt )
      - name: Upload ARM64 release
        if: github.ref_name == 'release/r36s-aarch64-safe-20261101'
        uses: actions/upload-artifact@v4
        with:
          name: FITD-R36S-AARCH64-RELEASE-RK3326-60FPS-NO-DEBUG
          path: |
            work/fitdr36s.zip
            work/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload ARM64 diagnostic build
        if: github.ref_name != 'release/r36s-aarch64-safe-20261101'
        uses: actions/upload-artifact@v4
        with:
          name: FITD-R36S-AARCH64-STARTUP-CREDITS-LEGAL
          path: work/fitdr36s-aarch64-startup-credits-legal.zip
          if-no-files-found: error
