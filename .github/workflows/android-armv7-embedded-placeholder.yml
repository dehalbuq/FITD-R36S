name: FITD Android ARMv7 embedded placeholder
on:
  push:
    branches: ["port/android-kitkat-api19"]
    paths:
      - 'v2/android-kitkat/embedded/**'
      - '.github/workflows/android-armv7-embedded-placeholder.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"
      - uses: actions/download-artifact@v4
        with:
          run-id: 41738748500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: FITD-ANDROID-ARMV7-API19-GAME-DATA-TEST
          path: /tmp/core
      - name: Assemble Android app sources and placeholder files
        run: |
          set -euo pipefail
          git clone --depth=1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cp -a v2/android-kitkat/android work
          mkdir -p work/app/src/main/java/org/libsdl/app work/app/src/main/jniLibs/armeabi-v7a work/app/src/main/assets
          cp -a /tmp/SDL2/android-project/app/src/main/java/. work/app/src/main/java/
          cp v2/android-kitkat/embedded/FITDEmbeddedActivity.java work/app/src/main/java/org/libsdl/app/
          SRC=/tmp/core/FITD-Android-ARMv7-GAME-DATA-API19-TEST.apk
          test -s "$SRC"
          unzip -p "$SRC" lib/armeabi-v7a/libmain.so > work/app/src/main/jniLibs/armeabi-v7a/libmain.so
          unzip -p "$SRC" lib/armeabi-v7a/libSDL2.so > work/app/src/main/jniLibs/armeabi-v7a/libSDL2.so
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          app=Path('work/app')
          gradle=app/'build.gradle'
          s=gradle.read_text()
          assert s.count('io.github.dehalbuq.fitdkitkatprobe') == 1
          gradle.write_text(s.replace('io.github.dehalbuq.fitdkitkatprobe','io.github.dehalbuq.fitdandroidembedded'))
          m=app/'src/main/AndroidManifest.xml'
          s=m.read_text()
          src='android:name="org.libsdl.app.SDLActivity"'
          assert s.count(src)==1
          s=s.replace(src,'android:name="org.libsdl.app.FITDEmbeddedActivity"',1)
          anchor='        </activity>\n    </application>'
          assert s.count(anchor)==1
          s=s.replace(anchor,'        </activity>\n        <activity android:name="org.libsdl.app.SDLActivity" android:exported="false" android:screenOrientation="landscape" android:configChanges="layoutDirection|locale|orientation|uiMode|screenLayout|screenSize|smallestScreenSize|keyboard|keyboardHidden|navigation" />\n    </application>')
          m.write_text(s)
          a=app/'src/main/assets'
          fake=bytes([0,0,0,0,12,0,0,0,8,0,0,0])
          names=['LISTBODY.PAK','LISTBOD2.PAK']
          with zipfile.ZipFile(a/'fitd-data.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
            for name in names:z.writestr(name,fake)
          (a/'fitd-manifest.txt').write_text('\n'.join(f'{n}|{len(fake)}|{hashlib.sha256(fake).hexdigest()}' for n in names)+'\n')
          print('No copyrighted game assets are present in CI.')
          PY
      - name: Build placeholder APK (not a game)
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.1.1-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          (cd work && /tmp/gradle-8.1.1/bin/gradle --no-daemon --stacktrace :app:assembleDebug)
          mkdir -p dist
          cp work/app/build/outputs/apk/debug/app-debug.apk dist/FITD-ARMV7-EMBEDDED-PLACEHOLDER.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/FITD-ARMV7-EMBEDDED-PLACEHOLDER.apk | tee /tmp/badging.txt
          grep -Fq "sdkVersion:'19'" /tmp/badging.txt
          grep -Fq "native-code: 'armeabi-v7a'" /tmp/badging.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FITD-ARMV7-EMBEDDED-PLACEHOLDER-NO-GAME-DATA
          path: dist/*
          if-no-files-found: error
