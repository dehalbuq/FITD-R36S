name: Android KitKat GLES2 native smoke build
on:
  push:
    branches: [port/android-kitkat-api19]
    paths:
      - "v2/android-kitkat/**"
      - ".github/workflows/android-kitkat-gles2.yml"
  workflow_dispatch:

jobs:
  armv7-api19-gles2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;23.2.8568313"
      - name: Fetch SDL2
        run: |
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git /tmp/SDL2
      - name: Cross-compile SDL2 for ARMv7 API19
        run: |
          cmake -S /tmp/SDL2 -B /tmp/sdl2-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/23.2.8568313/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-19 \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF -DSDL_TESTS=OFF
          cmake --build /tmp/sdl2-build --target SDL2 --parallel 2
      - name: Verify KitKat API19 toolchain and SDL2 output
        run: |
          test -s /tmp/sdl2-build/libSDL2.so
          grep -q "ANDROID_PLATFORM:[A-Z]*=android-19" /tmp/sdl2-build/CMakeCache.txt || { grep ANDROID_PLATFORM /tmp/sdl2-build/CMakeCache.txt; exit 1; }
      - name: Cross-compile GLES2 JNI test
        run: |
          cmake -S v2/android-kitkat -B /tmp/fitd-probe-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/23.2.8568313/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-19 \
            -DCMAKE_BUILD_TYPE=Release -DSDL2_ROOT=/tmp/sdl2-build \
            -DSDL2_INCLUDE_DIR=/tmp/SDL2/include
          cmake --build /tmp/fitd-probe-build --parallel 2
      - name: Check ELF binaries
        run: |
          file /tmp/fitd-probe-build/libmain.so /tmp/sdl2-build/libSDL2.so
          "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h /tmp/fitd-probe-build/libmain.so
      - name: Upload native smoke-test binaries
        uses: actions/upload-artifact@v4
        with:
          name: fitd-kitkat-gles2-native-armv7-test
          path: |
            /tmp/fitd-probe-build/libmain.so
            /tmp/sdl2-build/libSDL2.so
          if-no-files-found: error
