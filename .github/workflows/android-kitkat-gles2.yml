name: Android KitKat GLES2 APK smoke test

on:
  push:
    branches: [port/android-kitkat-api19]
    paths:
      - "v2/android-kitkat/**"
      - ".github/workflows/android-kitkat-gles2.yml"
  workflow_dispatch:

jobs:
  armv7-api19-gles2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;23.2.8568313" "platforms;android-34" "build-tools;34.0.0"
      - name: Fetch SDL2 source
        run: |
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git /tmp/SDL2
      - name: Compile SDL2 for ARMv7, API 19
        run: |
          cmake -S /tmp/SDL2 -B /tmp/sdl2-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/23.2.8568313/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-19 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF -DSDL_TESTS=OFF
          cmake --build /tmp/sdl2-build --target SDL2 --parallel 2
      - name: Check API 19 toolchain configuration
        run: |
          test -s /tmp/sdl2-build/libSDL2.so
          grep -Eq '^ANDROID_PLATFORM:[^=]+=android-19$' /tmp/sdl2-build/CMakeCache.txt
      - name: Compile GLES2 probe for ARMv7, API 19
        run: |
          cmake -S v2/android-kitkat -B /tmp/fitd-probe-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/23.2.8568313/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-19 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DSDL2_ROOT=/tmp/sdl2-build -DSDL2_INCLUDE_DIR=/tmp/SDL2/include
          cmake --build /tmp/fitd-probe-build --parallel 2
      - name: Verify native libraries
        run: |
          test -s /tmp/fitd-probe-build/libmain.so
          test -s /tmp/sdl2-build/libSDL2.so
          file /tmp/fitd-probe-build/libmain.so /tmp/sdl2-build/libSDL2.so
          "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d /tmp/fitd-probe-build/libmain.so /tmp/sdl2-build/libSDL2.so | grep NEEDED
      - name: Prepare standalone Android app
        run: |
          set -euo pipefail
          mkdir -p v2/android-kitkat/android/app/src/main/java
          mkdir -p v2/android-kitkat/android/app/src/main/jniLibs/armeabi-v7a
          cp -a /tmp/SDL2/android-project/app/src/main/java/. v2/android-kitkat/android/app/src/main/java/
          cp /tmp/sdl2-build/libSDL2.so v2/android-kitkat/android/app/src/main/jniLibs/armeabi-v7a/
          cp /tmp/fitd-probe-build/libmain.so v2/android-kitkat/android/app/src/main/jniLibs/armeabi-v7a/
          test -s v2/android-kitkat/android/app/src/main/java/org/libsdl/app/SDLActivity.java
      - name: Build installable APK with Gradle 8.1.1
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.1.1-bin.zip -o /tmp/gradle-8.1.1-bin.zip
          unzip -q /tmp/gradle-8.1.1-bin.zip -d /tmp
          cd v2/android-kitkat/android
          /tmp/gradle-8.1.1/bin/gradle --no-daemon --stacktrace :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/FITD-KitKat-GLES2-ARMv7-TEST.apk"
      - name: Validate APK minimum SDK, GLES and ABI
        run: |
          set -euo pipefail
          APK=dist/FITD-KitKat-GLES2-ARMv7-TEST.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/fitd-apk-badging.txt
          grep -Fq "sdkVersion:'19'" /tmp/fitd-apk-badging.txt
          grep -Eq "uses-gl-es: '0x0*20000'" /tmp/fitd-apk-badging.txt
          grep -Fq "native-code: 'armeabi-v7a'" /tmp/fitd-apk-badging.txt
          unzip -l "$APK" | tee /tmp/fitd-apk-contents.txt
          grep -Fq 'lib/armeabi-v7a/libSDL2.so' /tmp/fitd-apk-contents.txt
          grep -Fq 'lib/armeabi-v7a/libmain.so' /tmp/fitd-apk-contents.txt
          if grep -Fq 'lib/arm64-v8a/' /tmp/fitd-apk-contents.txt; then exit 1; fi
      - name: Upload Android 4.4 test APK
        uses: actions/upload-artifact@v4
        with:
          name: fitd-kitkat-gles2-armv7-apk-test
          path: dist/FITD-KitKat-GLES2-ARMv7-TEST.apk
          if-no-files-found: error
      - name: Upload standalone native libraries
        uses: actions/upload-artifact@v4
        with:
          name: fitd-kitkat-gles2-native-armv7-test
          path: |
            /tmp/fitd-probe-build/libmain.so
            /tmp/sdl2-build/libSDL2.so
          if-no-files-found: error
