name: FITD Wii Test05.2 - fix ETAGE inner room camera offset table

on:
  push:
    branches:
      - "port/wii-devkitppc-gx-prototype"
      - "port/wii-test02-archive-camera-gx"
      - "port/wii-test03-native-body-preview"
      - "fix/wii-test03-1-diagnostic-save"
      - "port/wii-test04-animation-gx"
      - "port/wii-test05-stage-camera-masks"
      - "fix/wii-test05-1-etage-pak-count"
      - "fix/wii-test05-2-stage-offset-table"
    paths:
      - "v2/wii/**"
      - ".github/workflows/wii-gx-boot-dol.yml"
  workflow_dispatch:

jobs:
  wii-powerpc:
    name: Build PowerPC Wii boot.dol and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout FITD-R36S Wii port
        uses: actions/checkout@v4

      - name: Test endian-safe original-game binary decoding on host
        run: |
          set -euxo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
             v2/wii/tests/test_endian.c -o /tmp/fitd-wii-endian-test
          /tmp/fitd-wii-endian-test
          cc -std=c11 -O2 -Wall -Wextra              v2/wii/tests/test_pak.c v2/wii/source/fitd_pak.c              v2/wii/source/fitd_unpack.c -o /tmp/fitd-wii-pak-test
          /tmp/fitd-wii-pak-test
          cc -DFITD_HOST_TEST -std=c11 -O2 -Wall -Wextra -Werror \
             v2/wii/tests/test_body.c v2/wii/source/fitd_body.c \
             v2/wii/source/fitd_pak.c v2/wii/source/fitd_unpack.c \
             -lm -o /tmp/fitd-wii-body-test
          /tmp/fitd-wii-body-test
          cc -DFITD_HOST_TEST -std=c11 -O2 -Wall -Wextra -Werror \
             v2/wii/tests/test_anim.c v2/wii/source/fitd_anim.c \
             v2/wii/source/fitd_body.c v2/wii/source/fitd_pak.c \
             v2/wii/source/fitd_unpack.c -lm -o /tmp/fitd-wii-anim-test
          /tmp/fitd-wii-anim-test
          cc -DFITD_HOST_TEST -std=c11 -O2 -Wall -Wextra -Werror \
             v2/wii/tests/test_stage.c v2/wii/source/fitd_stage.c \
             v2/wii/source/fitd_pak.c v2/wii/source/fitd_unpack.c \
             -lm -o /tmp/fitd-wii-stage-test
          /tmp/fitd-wii-stage-test
          # Confirm the stable Android Test19 corrections and R36S ARM64
          # recovery patches remain in branch ancestry for engine integration.
          test -f v2/android-kitkat/engine-runtime/patch_android_enemy_arm64_rehaunted.py
          test -f v2/patch_cellar_wall_recovery.py
          test -f v2/patch_cellar_revolver.py
          test -f v2/patch_hit_object_rehaunted.py
          test -f v2/patch_orb_enemy_effects.py
          test -f v2/patch_cellar_barrel_stuck.py
          echo "FITD Wii Test05.2: gameplay-fix source baseline preserved"

      - name: Compile Nintendo Wii boot.dol with real devkitPPC/libogc
        run: |
          set -euxo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src/v2/wii \
            devkitpro/devkitppc:20261102 \
            /bin/sh -c 'make clean && make -j2'
          test -s v2/wii/boot.dol
          test -s v2/wii/fitd-wii-gx.elf

      - name: Verify real PowerPC ELF and Nintendo Wii DOL
        run: |
          set -euxo pipefail
          file v2/wii/fitd-wii-gx.elf
          readelf -h v2/wii/fitd-wii-gx.elf | tee /tmp/fitd-wii-elf.txt
          grep -Eq 'Machine:.*PowerPC' /tmp/fitd-wii-elf.txt
          grep -Eq 'Data:.*big endian' /tmp/fitd-wii-elf.txt
          test "$(stat -c %s v2/wii/boot.dol)" -gt 8000
          sha256sum v2/wii/boot.dol

      - name: Package Homebrew Channel SD card layout (NO game assets)
        run: |
          set -euxo pipefail
          python3 v2/wii/create_icon.py v2/wii/icon.png
          mkdir -p dist/apps/fitd-wii/data
          cp v2/wii/boot.dol dist/apps/fitd-wii/boot.dol
          cp v2/wii/meta.xml dist/apps/fitd-wii/meta.xml
          cp v2/wii/icon.png dist/apps/fitd-wii/icon.png
          cp v2/wii/README.md dist/apps/fitd-wii/README.md
          cp v2/wii/PORT_PLAN.md dist/apps/fitd-wii/PORT_PLAN.md
          cp v2/wii/COMPAT_TEST19.md dist/apps/fitd-wii/COMPAT_TEST19.md
          printf 'Copy ETAGE00.PAK, CAMERA00.PAK, ITD_RESS.PAK, LISTBODY.PAK and LISTANIM.PAK from your own original game. Test05 previews ETAGE rooms, camera/mask polygons, 3D models and animation. Game assets are NOT included.\n' > dist/apps/fitd-wii/data/PUT_GAME_FILES_HERE.txt
          (cd dist && zip -q -r ../FITD-WII-GX-TEST05-2-ETAGE-MASCARAS-CORRIGIDAS.zip apps)
          test -s FITD-WII-GX-TEST05-2-ETAGE-MASCARAS-CORRIGIDAS.zip
          unzip -t FITD-WII-GX-TEST05-2-ETAGE-MASCARAS-CORRIGIDAS.zip | tail -n 2
          ls -lh FITD-WII-GX-TEST05-2-ETAGE-MASCARAS-CORRIGIDAS.zip

      - name: Upload Wii Homebrew boot.dol ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FITD-WII-TEST05-2-ETAGE-INNER-OFFSET-POWERPC
          path: FITD-WII-GX-TEST05-2-ETAGE-MASCARAS-CORRIGIDAS.zip
          if-no-files-found: error
